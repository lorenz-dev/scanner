[package]
name = "scanner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "scanner"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
arc-swap = "1.7.1"
bs58 = "0.5.1"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dashmap = "6.1"
futures = "0.3.31"
hex = "0.4.3"
parking_lot = "0.12"
ratatui = "0.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
solana-sdk = "3.0.0"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
yellowstone-grpc-client = "10.1.1"
yellowstone-grpc-proto = "10.1.1"
